<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon Symbol -->
  <g transform="translate(6, 6)">
    <!-- Hexagon Frame -->
    <polygon points="26,2 50,15 50,43 26,56 2,43 2,15" stroke="url(#gradLogo)" stroke-width="3" fill="rgba(99, 102, 241, 0.08)" filter="url(#glow)"/>
    <!-- Central Nexus Nodes & Connections -->
    <path d="M14,21 L38,35 M14,35 L38,21 M26,10 L26,46" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="26" cy="28" r="6" fill="#00D2FF" filter="url(#glow)"/>
    <circle cx="14" cy="21" r="3.5" fill="#6366F1"/>
    <circle cx="38" cy="21" r="3.5" fill="#A855F7"/>
    <circle cx="14" cy="35" r="3.5" fill="#A855F7"/>
    <circle cx="38" cy="35" r="3.5" fill="#6366F1"/>
  </g>
  
  <!-- Brand Text -->
  <text x="74" y="36" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    NEXUS<tspan fill="#00D2FF">CORE</tspan>
  </text>
  <text x="75" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="3.2">
    SOFTWARE TECHNOLOGIES
  </text>
</svg>
